name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Unpack plugin source
        run: unzip -o plugin-source.zip -d .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - run: python3 tools/test.py
      - run: python3 tools/build.py --android-platform 35 --version "${GITHUB_REF_NAME#v}"
      - name: Attach plugin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.zip.sha256 dist/kiosk-satellite-plugin.json --clobber
